# オントロジー（ontology/ の Ontology.xlsx・Profile.xlsx）を確かめる。
# 1. 各 CSV が xlsx から作ったものと同じか（xlsx を直したら CSV も作り直してコミットする）
# 2. osspublish の cto.pl・cts.pl で JSON-LD に変換できるか（変換した JSON-LD は成果物として残す）
name: check

on:
  push:
  pull_request:

env:
  # cto.pl・cts.pl を取る osspublish のコミット（変えるときはここを直す）
  OSSPUBLISH_REF: 6b51805f38670719435ca9ddd9e45d16a282c305  # osspublish MR !2（| 属性）。マージされたら dev のコミットに戻す

jobs:
  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CSV が xlsx と同じか
        run: |
          rc=0
          for name in Ontology Profile; do
            python3 tools/xlsx_to_csv.py ontology/$name.xlsx > /tmp/$name.csv
            if ! cmp -s /tmp/$name.csv ontology/$name.csv; then
              echo "::error file=ontology/$name.csv::$name.csv が $name.xlsx と違います。python3 tools/xlsx_to_csv.py ontology/$name.xlsx > ontology/$name.csv で作り直してください"
              diff /tmp/$name.csv ontology/$name.csv | head -40
              rc=1
            fi
          done
          exit $rc

      - name: Perl のモジュールを入れる
        run: sudo apt-get update && sudo apt-get install -y libtext-csv-xs-perl libjson-perl

      - name: cto.pl・cts.pl を取る
        run: |
          mkdir -p /tmp/cto
          for f in cto.pl cts.pl; do
            curl -sSfL "https://gitlab.com/assemblogue/osspublish/-/raw/${OSSPUBLISH_REF}/plrv2/contentsdata/cto/$f" -o /tmp/cto/$f
          done

      - name: JSON-LD に変換する
        run: |
          mkdir -p out && cd out
          rc=0
          for name in Ontology Profile; do
            perl /tmp/cto/cto.pl $name '' < ../ontology/$name.csv 2> $name.cto.err || rc=1
            [ -s $name.cto.err ] && { echo "::error::$name: cto.pl のエラー"; cat $name.cto.err; rc=1; }
            perl /tmp/cto/cts.pl $name < ../ontology/$name.csv 2> $name.cts.err || rc=1
            [ -s $name.cts.err ] && { echo "::error::$name: cts.pl のエラー"; cat $name.cts.err; rc=1; }
          done
          ls -l
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: ontology-jsonld
          path: out/*.jsonld
